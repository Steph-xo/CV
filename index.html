<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa Interactivo – Guerra Irán-Irak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Librería de Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // 🔑 Tu token personal
    mapboxgl.accessToken = 'pk.eyJ1Ijoic3RlcGgtMDQwOCIsImEiOiJjbWgxY3d1ZTgyancyMmxuYTFqMWhwdHVyIn0.FieEqJj_-G5jJa0FZcmj1Q';

    // 🗺️ Crear el mapa
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12', // estilo base
      center: [47.5, 31.5], // coordenadas iniciales [longitud, latitud]
      zoom: 6
    });

    // 📍 Agregar tu tileset
    map.on('load', () => {
      map.addSource('iran-iraq-war', {
        'type': 'vector',
        'url': 'mapbox://steph-0408.bhpafmq4' // tu tileset
      });

      map.addLayer({
        'id': 'iran-iraq-layer',
        'type': 'circle',
        'source': 'iran-iraq-war',
        // 👇 este nombre debes reemplazarlo por el que veas en tu tileset (en Mapbox Studio)
        'source-layer': 'iran_iraq_conflict_map',
        'paint': {
          'circle-radius': 6,
          'circle-color': '#ff5500'
        }
      });
    });
  </script>
</body>
</html>
